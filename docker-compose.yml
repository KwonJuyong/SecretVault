services:
  # 이 서버에서는 기본으로 뜨지 않는다.
  #
  # 80/443 은 여러 사이트(ai-eval, portfolio, …)를 함께 라우팅하는 공용 게이트웨이
  # 컨테이너가 이미 잡고 있고, 그쪽 Caddyfile 은 /home/juyong/gateway/Caddyfile 이다.
  # 여기 있는 Caddyfile 은 juyong.store → SecretVault 만 알기 때문에, 이 서비스를
  # 띄우면 포트가 충돌하거나(별개 컨테이너일 때) 게이트웨이 설정을 덮어써서
  # (같은 프로젝트일 때) 다른 사이트가 죽는다.
  #
  # SecretVault 만 단독으로 돌리는 서버에서만:  docker compose --profile standalone up -d
  caddy:
    profiles: ["standalone"]
    image: caddy:2-alpine
    container_name: vault-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  db:
    image: postgres:15
    container_name: vault-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

  backend:
    build: ./backend
    container_name: vault-backend
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8001:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vault-frontend
    restart: always
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env
    command: sh -c "npm install --legacy-peer-deps 2>/dev/null; rm -rf .next && npm run dev"
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  postgres_data:
  frontend_node_modules:
  caddy_data:
  caddy_config:
