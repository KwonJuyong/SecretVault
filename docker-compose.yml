services:
  db:
    image: postgres:15
    container_name: vault-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

  backend:
    build: ./backend
    container_name: vault-backend
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      - default
      - web_gateway

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vault-frontend
    restart: always
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env
    command: npm run dev
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - default
      - web_gateway

volumes:
  postgres_data:
  frontend_node_modules:

networks:
  default:
  web_gateway:
    external: true
