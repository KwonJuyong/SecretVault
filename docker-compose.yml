version: '3.8'

services:
  # 1. 데이터베이스 (포트 충돌 방지: 5433)
  db:
    image: postgres:15
    container_name: vault-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

  # 2. 백엔드 (8001번으로 노출)
  backend:
    build: ./backend
    container_name: vault-backend
    volumes:
      - ./backend:/app
    depends_on:
      - db
    env_file:
      - .env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8001:8000"

  # 3. 프론트엔드 (3001번으로 노출)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vault-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    command: npm run dev
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  postgres_data: