version: '3.8'

services:
  # 1. Nginx (유일한 입구: 80번 포트)
  nginx:
    image: nginx:latest
    container_name: cloud-vault-nginx
    restart: always
    ports:
      - "80:80"  # 웹서버 포트만 엽니다.
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  # 2. 데이터베이스 (외부 접속 차단, 로컬만 허용)
  db:
    image: postgres:15
    container_name: cloud-vault-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # ★ 핵심: 127.0.0.1을 붙여서 외부(인터넷)에서는 접속 불가!
      # 오직 VS Code가 설치된 서버 내부에서만 접속 가능
      - "127.0.0.1:5432:5432"

  # 3. 백엔드 (외부 포트 제거 -> Nginx하고만 통신)
  backend:
    build: ./backend
    container_name: cloud-vault-backend
    volumes:
      - ./backend:/app
    depends_on:
      - db
    env_file:
      - .env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    # ports: - "8000:8000"  <-- 삭제됨 (외부 접속 불가)

  # 4. 프론트엔드 (외부 포트 제거 -> Nginx하고만 통신)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloud-vault-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    command: npm run dev
    # ports: - "3000:3000"  <-- 삭제됨 (외부 접속 불가)

volumes:
  postgres_data: