events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name juyong.store www.juyong.store;

        # 1. 프론트엔드 연결 (기본 접속)
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. 백엔드 API 연결 (/api로 시작하면 백엔드로 토스)
        location /api/ {
            # /api/notes -> 백엔드의 /notes 로 변환해서 전달
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}